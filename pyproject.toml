[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rqvae-recommender"
version = "0.1.0"
requires-python = ">=3.10"
description = "Level-Aware Hybrid Decoding for Generative Retrieval (CIKM 2026)"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
experiments = [
    "scipy>=1.13",
    "optuna>=3.6",
    "pyarrow>=16.0",
    "pandas>=2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "boto3>=1.34",
    "sagemaker>=2.220",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["modules", "evaluate", "data"]
omit = ["tests/*", "sagemaker/*", "scripts/*", "paper/*", "evaluate/run_eval.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["modules/decoding", "modules/heads", "modules/analysis", "evaluate/metrics.py", "evaluate/stats.py", "evaluate/result_store.py"]
